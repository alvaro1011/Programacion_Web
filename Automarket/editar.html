<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMarket - Editar Vehículo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="logo">AutoMarket</a>
            <a href="index.html" class="btn btn-secondary">Volver al Catálogo</a>
        </div>
    </header>

    <main class="form-page-container">
        <h2>Editar Publicación</h2>
        
        <form id="editForm" novalidate>
            <div class="form-group">
                <label for="vehicleTitle">Título del vehículo:</label>
                <input type="text" id="vehicleTitle" value="Chevrolet Tracker 2026">
                <span id="titleError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="vehicleCategory">Categoría:</label>
                <select id="vehicleCategory">
                    <option value="Camioneta" selected>Camioneta</option>
                    <option value="Sedán">Sedán</option>
                    <option value="Hatchback">Hatchback</option>
                </select>
                <span id="categoryError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="vehiclePrice">Precio ($):</label>
                <input type="number" id="vehiclePrice" value="95000000">
                <span id="priceError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="vehicleStatus">Estado:</label>
                <select id="vehicleStatus">
                    <option value="Nuevo" selected>Nuevo</option>
                    <option value="Usado">Usado</option>
                </select>
                <span id="statusError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="vehicleContact">Número de Contacto:</label>
                <input type="tel" id="vehicleContact" value="3009876543">
                <span id="contactError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="vehicleImage">Actualizar Foto:</label>
                <input type="file" id="vehicleImage" accept="image/*">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                <a href="index.html" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
