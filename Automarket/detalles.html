<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoMarket - Detalles del Vehículo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="logo">AutoMarket</a>
            <a href="index.html" class="btn btn-secondary">Volver al Catálogo</a>
        </div>
    </header>

    <main class="container">
        <div class="details-wrapper">
            <img id="detailImg" alt="Vehículo" class="details-img hidden">

            <div class="details-content">
                <h2 id="detailTitle">Cargando...</h2>
                <p><strong>Categoría:</strong> <span id="detailCategory"></span></p>
                <p><strong>Estado:</strong> <span id="detailStatus"></span></p>
                <p><strong>Precio:</strong> <span id="detailPrice" class="card-price"></span></p>

                <div class="contact-box">
                    <p><strong>Contacto con el Propietario / Concesionario:</strong></p>
                    <p id="detailContact" class="contact-number"></p>
                </div>

                <div class="card-actions card-actions-detail">
                    <a id="btnEditDetail" href="editar.html" class="btn btn-warning">Editar este vehículo</a>
                    <a href="index.html" class="btn btn-secondary">Regresar al Catálogo</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/utils/formato.js"></script>
    <script src="js/utils/navegacion.js"></script>
    <script src="js/models/almacenamientoLocal.js"></script>
    <script src="js/models/vehiculoModelo.js"></script>
    <script src="js/views/detalleVista.js"></script>
    <script src="js/controllers/detalleControlador.js"></script>
</body>
</html>
